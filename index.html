<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目任务看板 · 项目推进明细管理</title>
<style>
:root{
  --primary:#2563eb; --primary-2:#3b82f6; --primary-deep:#1e3a5f;
  --bg:#f2f6fc; --bg-2:#e9f0fa; --card:#ffffff;
  --text:#1f2d3d; --text-2:#5b6b80; --border:#dbe4ef;
  --accent-1:#e8f0fe; --green:#16a34a; --orange:#d97706; --red:#dc2626; --gray:#8b96a5;
  --shadow:0 2px 10px rgba(30,58,138,.06); --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  background:linear-gradient(165deg,#f2f6fc 0%,#f8fbff 55%,#e6eefb 100%);
  color:var(--text);font-size:13px;line-height:1.6;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}
::placeholder{color:#9db0c7}

/* ===== 顶栏 ===== */
#topbar{display:flex;align-items:center;gap:16px;height:52px;padding:0 16px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--primary-deep);white-space:nowrap}
.brand svg{width:20px;height:20px;stroke:var(--primary)}
.brand .ver{font-size:10px;color:var(--text-2);font-weight:500;background:var(--accent-1);padding:1px 6px;border-radius:10px}
#tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.tab{padding:6px 14px;border-radius:9px;font-size:13px;color:var(--text-2);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:all .15s}
.tab svg{width:15px;height:15px}
.tab:hover{background:var(--bg);color:var(--text)}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.35)}
.tools{display:flex;align-items:center;gap:8px}
.search-box{position:relative}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:#9db0c8}
.search-box input{width:180px;padding:6px 10px 6px 28px;border:1px solid var(--border);border-radius:9px;background:#f7fafd;outline:none;transition:all .15s}
.search-box input:focus{border-color:var(--primary-2);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:12.5px;white-space:nowrap;transition:all .15s}
.btn svg{width:14px;height:14px;stroke:currentColor}
.btn:hover{border-color:var(--primary-2);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{color:var(--red);border-color:#f3c6c6}
.btn.danger:hover{background:#fdf0f0}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:7px}

/* ===== 布局 ===== */
#layout{display:flex;height:calc(100% - 52px);position:relative;z-index:10}
#sidebar{width:220px;min-width:220px;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);
  border-right:1px solid var(--border);padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.side-title{font-size:11px;color:var(--text-2);padding:4px 8px;display:flex;justify-content:space-between;align-items:center}
.side-title .mini{font-size:11px;color:var(--primary);font-weight:600;cursor:pointer}
.tree-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--text-2);font-size:13px}
.tree-item svg{width:15px;height:15px;flex:none}
.tree-item:hover{background:var(--bg)}
.tree-item.active{background:var(--accent-1);color:var(--primary);font-weight:600}
.tree-item.group{padding-left:22px}
.tree-item .cnt{margin-left:auto;font-size:11px;color:#9db0c8}
.tree-item .ops{display:none;gap:2px}
.tree-item:hover .ops{display:flex}
.tree-item .ops button{display:flex;padding:2px;border-radius:5px;color:var(--text-2)}
.tree-item .ops button:hover{background:#dbe7f6;color:var(--primary)}
.tree-item .ops svg{width:13px;height:13px}
.side-add{margin-top:2px;color:var(--primary);border:1px dashed var(--primary-2);border-radius:8px;padding:6px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;cursor:pointer;background:rgba(255,255,255,.5)}
.side-add:hover{background:var(--accent-1)}
.side-add svg{width:14px;height:14px}
#main{flex:1;overflow:hidden;padding:14px 16px;min-width:0}

/* ===== 页头 ===== */
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.page-head h2{font-size:16px;font-weight:700;color:var(--primary-deep)}
.page-head .crumb{color:var(--text-2);font-size:12.5px}
.page-head .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:16px;font-size:12px;background:var(--accent-1);color:var(--primary)}

/* ===== 看板 ===== */
.kanban{display:flex;gap:10px;height:calc(100% - 44px);overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.kanban-col{width:246px;min-width:246px;background:rgba(255,255,255,.66);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;max-height:100%}
.kcol-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.kcol-idx{width:18px;height:18px;border-radius:6px;background:var(--accent-1);color:var(--primary);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.kcol-name{font-weight:700;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcol-cnt{font-size:11.5px;color:var(--text-2);background:var(--bg);border-radius:10px;padding:1px 8px}
.kcol-current{width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--accent-1);flex:none}
.kcol-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px;min-height:60px}
.kcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;box-shadow:0 1px 3px rgba(30,58,138,.05);cursor:grab;transition:all .15s;position:relative}
.kcard:hover{box-shadow:0 4px 14px rgba(30,58,138,.12);border-color:#c7d8f2;transform:translateY(-1px)}
.kcard.dragging{opacity:.45;transform:rotate(2deg)}
.kcard.drag-over{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,130,246,.25)}
.kcard .kc-title{font-size:13px;font-weight:600;line-height:1.45;word-break:break-word}
.kcard .kc-title:hover{color:var(--primary)}
.kcard .kc-sub{font-size:11px;color:#9db0c8;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .kc-node{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:1px 7px;border-radius:9px;background:#f0f4fb;color:var(--text-2);margin-top:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .kc-meta{display:flex;align-items:center;gap:8px;margin-top:7px;color:var(--text-2);font-size:11.5px;flex-wrap:wrap}
.kcard .kc-meta .m{display:inline-flex;align-items:center;gap:4px}
.kcard .kc-meta svg{width:12px;height:12px}
.kc-prog{margin-top:8px}
.kc-prog .track{height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.kc-prog .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary-2),#7aa7f5)}
.kc-prog .pt{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-2);margin-top:3px}
.kcard .kc-foot{display:flex;align-items:center;margin-top:8px;gap:6px}
.avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--primary-2),#7aa7f5);color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.avatar.external{background:linear-gradient(135deg,#7d8ea5,#a8b8cd)}
.due-over{color:var(--red)!important;font-weight:600}
.kc-more{margin-left:auto;color:#b7c5d8;padding:2px 5px;border-radius:6px;display:inline-flex}
.kc-more:hover{background:var(--bg);color:var(--text-2)}
.kc-more svg{width:14px;height:14px}
.kcol-empty{color:#b7c5d8;font-size:12px;text-align:center;padding:18px 0;border:1.5px dashed var(--border);border-radius:9px}
.add-card-btn{margin:10px;padding:8px;border-radius:9px;border:1.5px dashed var(--border);color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;transition:all .15s;flex:none}
.add-card-btn:hover{border-color:var(--primary-2);color:var(--primary);background:var(--accent-1)}
.add-card-btn svg{width:14px;height:14px}

/* ===== 状态徽章 ===== */
.st{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap;flex:none}
.st::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.st.todo{background:#eef1f5;color:var(--gray)}
.st.doing{background:var(--accent-1);color:var(--primary)}
.st.done{background:#e8f5e9;color:var(--green)}
.st.risk{background:#fde8e8;color:var(--red)}
.st.overdue{background:#fff3e0;color:var(--orange)}

/* ===== 仪表盘 ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden}
.stat-card .v{font-size:24px;font-weight:800;color:var(--primary-deep);line-height:1.2}
.stat-card .v.red{color:var(--red)} .stat-card .v.orange{color:var(--orange)} .stat-card .v.green{color:var(--green)}
.stat-card .l{font-size:11.5px;color:var(--text-2);margin-top:2px}
.stat-card::after{content:'';position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,var(--accent-1),transparent 70%)}
.dash-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;height:calc(100% - 96px);min-height:300px}
.dash-panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.dash-panel .dp-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px;color:var(--primary-deep)}
.dash-panel .dp-body{flex:1;overflow-y:auto;padding:12px 14px}
.stage-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:12.5px}
.stage-row .nm{width:74px;color:var(--text-2);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-row .bar-track{flex:1;height:18px;background:var(--bg);border-radius:9px;overflow:hidden;position:relative}
.stage-row .bar-fill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--primary-2),#7aa7f5)}
.stage-row .bar-num{width:30px;text-align:right;font-weight:700;color:var(--primary)}
.mlist{list-style:none}
.mlist li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px dashed var(--border);font-size:12.5px}
.mlist li:last-child{border-bottom:none}
.mlist .md{font-size:11px;color:var(--text-2);min-width:86px;text-align:right}
.mlist .mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist .mp{color:var(--text-2);font-size:11px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist .over{color:var(--red);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* ===== 成员 ===== */
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.member-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all .15s}
.member-card:hover{border-color:var(--primary-2);box-shadow:var(--shadow)}
.member-card .mc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.member-card .mc-name{font-weight:700;font-size:13.5px}
.member-card .mc-kind{font-size:10.5px;padding:1px 7px;border-radius:10px}
.member-card .mc-kind.i{background:var(--accent-1);color:var(--primary)}
.member-card .mc-kind.e{background:#f1f3f7;color:var(--text-2)}
.member-card .mc-org{font-size:11.5px;color:var(--text-2)}
.member-card .mc-proj{margin-top:6px;font-size:11.5px;color:var(--text-2);border-top:1px dashed var(--border);padding-top:6px}

/* ===== 设置 ===== */
.settings-group{background:#fff;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.settings-group .sg-head{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;color:var(--primary-deep)}
.settings-group .sg-body{padding:14px 16px}
.stagecfg-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stagecfg-row .seq{width:22px;color:var(--text-2);font-size:12px;text-align:center}
.stagecfg-row input[type=text]{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:8px;outline:none}
.stagecfg-row input:focus{border-color:var(--primary-2)}
.row-ops{display:flex;gap:4px}
.row-ops button{display:inline-flex;padding:4px;border-radius:6px;color:var(--text-2)}
.row-ops button:hover{background:var(--accent-1);color:var(--primary)}
.row-ops svg{width:14px;height:14px}
.row-ops button:disabled{opacity:.35;cursor:not-allowed}
.hint-line{font-size:12px;color:var(--text-2);margin-top:8px}

/* ===== 弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(30,58,138,.28);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:640px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(20,40,90,.25);animation:pop .18s ease}
.modal.lg{width:960px}
.modal.sm{width:400px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px;font-weight:700;color:var(--primary-deep);flex:1;min-width:0}
.modal-x{display:inline-flex;padding:5px;border-radius:8px;color:var(--text-2)}
.modal-x:hover{background:var(--bg);color:var(--text)}
.modal-x svg{width:16px;height:16px}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.full{grid-column:1/-1}
.fg label{font-size:11.5px;color:var(--text-2);font-weight:600}
.fg input,.fg select,.fg textarea{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fbfcfe;outline:none;width:100%;transition:all .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--primary-2);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.fg textarea{resize:vertical;min-height:56px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:6px 0;border-radius:8px;border:1px solid var(--border);font-size:12.5px;color:var(--text-2);transition:all .12s}
.seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg button.on.risk{background:var(--red);border-color:var(--red)}
.seg button.on.done{background:var(--green);border-color:var(--green)}
.confirm-text{font-size:13.5px;line-height:1.8;padding:6px 0}
.confirm-text b{color:var(--red)}
.import-report .ir-line{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--bg);margin-bottom:6px;font-size:13px}
.ir-line .ir-num{font-weight:800;font-size:16px;min-width:64px}
.ir-line .ir-num.add{color:var(--green)}.ir-line .ir-num.upd{color:var(--primary)}.ir-line .ir-num.keep{color:var(--text-2)}.ir-line .ir-num.orphan{color:var(--orange)}

/* ===== 项目详情：表头区 + 阶段进度 ===== */
.pd-crumb{font-size:12px;color:var(--text-2);margin-bottom:10px}
.pd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 16px;font-size:12.5px;background:var(--bg);border-radius:10px;padding:12px}
.pd-grid .k{color:var(--text-2)}
.pd-grid .v{font-weight:600}
.pd-block{margin-top:10px;font-size:12.5px;color:var(--text);background:var(--bg);border-radius:8px;padding:10px;white-space:pre-wrap}
.pd-block.remarks{background:#fffaf0;border:1px solid #f5e3c3;color:#8a5a00}
.pd-block-title{font-size:12px;font-weight:700;color:var(--primary-deep);margin:14px 0 6px}
.stagebar{display:flex;gap:4px;margin:12px 0 4px;flex-wrap:wrap}
.stagebar .sb{flex:1;min-width:56px;text-align:center;font-size:10.5px;color:var(--text-2);cursor:pointer;padding:4px 2px;border-radius:6px;border:1px solid transparent;transition:all .12s}
.stagebar .sb:hover{background:var(--bg)}
.stagebar .sb .sbn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stagebar .sb.done{color:var(--green)}
.stagebar .sb.done .sbn::before{content:'✓ '}
.stagebar .sb.cur{background:var(--accent-1);color:var(--primary);font-weight:700;border-color:var(--primary-2)}
.stagebar .sb .sbp{font-size:9.5px;color:#9db0c8}
.viewswitch{display:flex;gap:2px;background:var(--bg);border-radius:9px;padding:3px}
.viewswitch button{padding:5px 14px;border-radius:7px;font-size:12.5px;color:var(--text-2)}
.viewswitch button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 4px rgba(30,58,138,.12)}

/* ===== 阶段折叠卡 ===== */
.stagefold{border:1px solid var(--border);border-radius:10px;margin-bottom:9px;overflow:hidden;background:#fbfcfe}
.stagefold.cur{border-color:var(--primary-2);box-shadow:0 0 0 2px rgba(59,130,246,.12)}
.sf-head{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;background:#fff}
.sf-head .idx{width:18px;height:18px;border-radius:6px;background:var(--accent-1);color:var(--primary);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sf-head .nm{font-weight:700;font-size:13px;flex:1}
.sf-head .cnt{font-size:11.5px;color:var(--text-2)}
.sf-head .arrow{transition:transform .15s;color:#b7c5d8;display:inline-flex}
.sf-head .arrow svg{width:14px;height:14px}
.stagefold.open .sf-head .arrow{transform:rotate(180deg)}
.sf-body{display:none;padding:8px 10px}
.stagefold.open .sf-body{display:block}
.task-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:#fff;cursor:pointer;transition:all .12s}
.task-row:hover{border-color:var(--primary-2)}
.task-row .tr-name{font-weight:600;font-size:12.5px;flex:1;min-width:0}
.task-row .tr-node{font-size:10.5px;color:var(--text-2);background:#f0f4fb;border-radius:8px;padding:1px 7px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-row .tr-dates{font-size:11px;color:var(--text-2);display:flex;gap:8px;white-space:nowrap}
.task-row .tr-dates .od{color:var(--red);font-weight:600}
.task-row .tr-deliv{font-size:11px;color:var(--primary);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-row .avatar{width:20px;height:20px;font-size:9.5px}

/* ===== 推进明细表视图 ===== */
.detail-table-wrap{border:1px solid var(--border);border-radius:10px;overflow:auto;max-height:52vh;background:#fff}
table.detail-table{border-collapse:collapse;font-size:12px;width:100%;min-width:860px}
table.detail-table th{background:linear-gradient(135deg,#c9d6f3,#e8f0fe);color:var(--primary-deep);font-weight:700;padding:9px 10px;border:1px solid var(--border);position:sticky;top:0;z-index:2;white-space:nowrap}
table.detail-table td{padding:8px 10px;border:1px solid var(--border);vertical-align:top;color:var(--text)}
table.detail-table td.stagecell{background:var(--bg-2);font-weight:700;color:var(--primary-deep);width:88px;text-align:center;vertical-align:middle}
table.detail-table td.stagecell .idx{display:block;font-size:10px;color:var(--primary);font-weight:600}
table.detail-table tr.rowdone td{color:#8fa0b5}
table.detail-table td.footercell{background:#fffaf0;color:#8a5a00;padding:10px;white-space:pre-wrap}
table.detail-table td.footercell .ft{font-weight:700;display:block;margin-bottom:4px;font-size:11px;color:#a06a00}

/* ===== 下拉菜单 / Toast ===== */
.menu{position:fixed;z-index:99;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(20,40,90,.14);padding:5px;display:none;min-width:150px}
.menu.show{display:block}
.menu-item{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:7px;font-size:12.5px;color:var(--text);width:100%;text-align:left}
.menu-item:hover{background:var(--accent-1);color:var(--primary)}
.menu-item svg{width:14px;height:14px}
.menu-item.danger{color:var(--red)}
.menu-item.danger:hover{background:#fdf0f0}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--primary-deep);color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;box-shadow:0 6px 20px rgba(20,40,90,.3);animation:tin .2s ease;max-width:320px}
.toast.ok{background:#15803d}.toast.err{background:#b91c1c}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ===== v2.1 新增样式 ===== */
/* 项目切换 pills */
.proj-switch{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ps-pill{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 14px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text-2);transition:all .15s;min-width:140px;text-align:left}
.ps-pill:hover{border-color:var(--primary-2)}
.ps-pill.on{border-color:var(--primary);background:var(--accent-1);color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.ps-name{font-weight:700;font-size:12.5px}
.ps-meta{font-size:10.5px;opacity:.8}
/* 仪表盘当前阶段卡片 */
.dp-head2{font-size:13px;font-weight:700;color:var(--primary-deep);margin:0 0 8px}
.cur-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cur-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.cur-card:hover{border-color:var(--primary-2);box-shadow:var(--shadow);transform:translateY(-1px)}
.cur-card::after{content:'';position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,var(--accent-1),transparent 70%);pointer-events:none}
.cc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cc-name{font-weight:700;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-cust{font-size:11px;color:var(--text-2)}
.cc-stage{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cc-stage-pill{font-size:15px;font-weight:800;color:var(--primary);background:var(--accent-1);padding:3px 14px;border-radius:16px}
.cc-locked{display:inline-flex;color:var(--orange)}
.cc-locked svg{width:13px;height:13px}
.cc-km{font-size:12px;color:var(--text-2);background:#f6f9fd;border-radius:8px;padding:6px 10px;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-km.empty{color:#b7c5d8}
.cc-prog{margin-bottom:6px}
.cc-prog .track{height:8px;background:var(--bg);border-radius:3px;overflow:hidden}
.cc-prog .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary-2),#7aa7f5)}
.cc-prog .pt{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-2);margin-top:3px}
.cc-meta{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:8px}
.cc-total{color:var(--text-2);margin-left:auto}
.cc-mini{display:flex;gap:3px}
.cc-mini .cm{flex:1;height:4px;border-radius:2px;background:var(--bg)}
.cc-mini .cm.done{background:var(--green)}
.cc-mini .cm.cur{background:var(--primary)}
/* 项目看板：宽列 + 阶段卡 */
.kanban-lg .kanban-col{width:300px;min-width:300px}
.kanban-col.cur-col{border-color:var(--primary-2);box-shadow:0 0 0 2px rgba(59,130,246,.14)}
.stage-body{padding:10px}
.stage-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.stage-card.phase-done{border-color:#bcd9c0}
.stage-card.phase-risk{border-color:#f3c6c6}
.stage-card.phase-doing{border-color:#c7d8f2}
.sc-badge{padding:8px 10px 0}
.sc-km{font-size:11.5px;color:var(--text-2);background:#f6f9fd;margin:8px 10px 0;padding:6px 10px;border-radius:8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-km:hover{color:var(--primary);border:1px solid var(--primary-2)}
.sc-km.empty{color:#9db7c5;border:1px dashed var(--border);background:#fff}
.kc-flag{margin-left:auto;display:inline-flex;padding:3px;border-radius:6px;color:#b7c5d8;flex:none}
.kc-flag:hover{background:var(--bg);color:var(--primary)}
.kc-flag.locked{color:var(--orange)}
/* 阶段卡内 mini 任务行 */
.mini-task{border:1px solid var(--border);border-radius:9px;padding:7px 10px;margin:8px 10px 0;background:#fff;cursor:pointer;transition:all .12s}
.mini-task:hover{border-color:var(--primary-2);box-shadow:0 2px 6px rgba(30,58,138,.08)}
.mt-line1{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.mt-name{font-weight:600;font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-line2{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-2);flex-wrap:wrap}
.mt-d{color:var(--text-2)}
.mt-d.od{color:var(--red);font-weight:600}
.mt-deliv{display:inline-flex;align-items:center;gap:3px;color:var(--primary);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-deliv svg{width:11px;height:11px}
/* 标签 chip */
.tagchip{display:inline-flex;align-items:center;padding:1px 8px;border-radius:9px;font-size:10px;font-weight:600;flex:none}
.tagchip.more{background:var(--bg);color:var(--text-2)}
.tagchip.role{background:var(--accent-1);color:var(--primary)}
.kc-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
/* 任务看板列头关键节点 */
.kcol-km{font-size:10.5px;color:var(--text-2);padding:5px 12px;border-bottom:1px solid var(--border);background:#fbfcfe;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 树：一层项目列表 + 多客户分组标题 */
#sidebar{width:264px;min-width:264px}
.tree-item.proj{padding-left:8px}
.tree-item.proj .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-group{display:flex;align-items:center;gap:7px;padding:8px 8px 4px;color:var(--text-2);font-size:11px;font-weight:700;letter-spacing:.5px;user-select:none}
.tree-group svg{width:13px;height:13px;flex:none;opacity:.7}
.tree-group .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-group .cnt{font-size:10px;color:#9db0c8}
.tree-group .ops{display:none;gap:2px}
.tree-group:hover .ops{display:flex}
.tree-group .ops button{display:flex;padding:2px;border-radius:5px;color:var(--text-2)}

.tree-group .ops svg{width:12px;height:12px}
/* 阶段折叠卡关键节点行 */
.sf-km{font-size:11.5px;color:var(--text-2);background:#f6f9fd;margin:0 12px 8px;padding:6px 10px;border-radius:8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf-km:hover{color:var(--primary)}
.sf-km.empty{color:#9db7c7;background:#fff;border:1px dashed var(--border)}
.tr-tags{display:inline-flex;gap:4px;align-items:center}
/* 明细表关键节点列 */
table.detail-table td.kmcell{background:#fbfcfe;color:var(--text-2);text-align:center;vertical-align:middle}
table.detail-table td.kmcell .km-empty{color:#b7c5d8;font-size:10px}
/* 标签选择器 */
.tag-picker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:8px;background:#fbfcfe}
.tp-chip{padding:4px 12px;border-radius:14px;font-size:12px;border:1px solid var(--tc);color:var(--tc);background:#fff;transition:all .12s}
.tp-chip.on{background:var(--tc);color:#fff;font-weight:600}
.tp-new{display:inline-flex;gap:4px;align-items:center}
.tp-new input{width:110px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;outline:none}
/* 标签设置行 */
.tagcfg-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tagcfg-row .tcolor{width:16px;height:16px;border-radius:50%;flex:none}
.tagcfg-row input[type=text]{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:8px;outline:none}
.tagcfg-row input[type=text]:focus{border-color:var(--primary-2)}
.tagbuiltin{font-size:10.5px;color:var(--text-2);background:var(--bg);border-radius:8px;padding:1px 7px}
/* 按项目导出弹窗 */
.ep-list{max-height:40vh;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:8px}
.ep-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12.5px}
.ep-row:hover{background:var(--bg)}
.ep-row .ep-name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-row .ep-meta{font-size:11px;color:var(--text-2)}
/* 设置分组标签 */
.dm-label{font-size:11.5px;color:var(--text-2);font-weight:600;margin:0 0 6px}
/* 成员任务分组 */
.mt-group{margin-bottom:10px}
.mt-group-head{font-size:12px;font-weight:700;color:var(--primary-deep);padding:4px 2px 6px;border-bottom:1px dashed var(--border);margin-bottom:6px}
/* 空态 */
.empty-box{background:#fff;border:1px dashed var(--border);border-radius:var(--radius);color:#b7c5d8;text-align:center;padding:28px;font-size:13px}
/* 任务看板 toggle */
.tb-toggle{display:inline-flex;gap:4px;background:var(--bg);border-radius:9px;padding:3px;margin-bottom:10px}
.tb-toggle button{padding:5px 14px;border-radius:7px;font-size:12.5px;color:var(--text-2)}
.tb-toggle button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 4px rgba(30,58,138,.12)}
/* 阶段状态徽章色 */
.st.phase-done{background:#e8f5e9;color:var(--green)}
.st.phase-risk{background:#fde8e8;color:var(--red)}
.st.phase-doing{background:var(--accent-1);color:var(--primary)}
.st.phase-empty{background:#eef1f5;color:var(--gray)}
/* ===== v2.2 新增：设置页导出导入大按钮 ===== */
.dm-hero .sg-head{font-size:14px}
.dm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dm-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#fff;transition:all .15s;text-align:left}
.dm-btn:hover{border-color:var(--primary-2);box-shadow:var(--shadow);transform:translateY(-1px)}
.dm-btn .dm-ic{width:36px;height:36px;border-radius:10px;background:var(--accent-1);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;flex:none}
.dm-btn .dm-ic svg{width:16px;height:16px}
.dm-btn.primary .dm-ic{background:var(--primary);color:#fff}
.dm-btn .dm-tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.dm-btn .dm-t{font-weight:700;font-size:13px;color:var(--text)}
.dm-btn .dm-d{font-size:10.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== v2.2 新增：任务意见与讨论 ===== */
.task-card{cursor:pointer}
.cm-list{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.cm-item{border:1px solid var(--border);border-radius:10px;background:#fbfcfe;padding:8px 10px}
.cm-item:hover{border-color:#c7d8f2}
.cm-head{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.cm-head .avatar{width:20px;height:20px;font-size:9.5px}
.cm-author{font-weight:700;font-size:12px;color:var(--primary-deep)}
.cm-time{font-size:10.5px;color:#9db0c8}

.cm-item:hover .cm-del{opacity:1}
.cm-del:hover{background:#fde8e8;color:var(--red)}
.cm-del svg{width:12px;height:12px}
.cm-text{font-size:12.5px;color:var(--text);line-height:1.6;word-break:break-word;background:#fff;border-radius:8px;padding:7px 10px}
.cm-empty{font-size:12px;color:#b7c5d8;padding:10px 4px;text-align:center;border:1.5px dashed var(--border);border-radius:10px}
.cm-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cm-form select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fbfcfe;outline:none;max-width:150px}
.cm-form select:focus{border-color:var(--primary-2)}
.cm-form input{flex:1;min-width:200px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fbfcfe;outline:none}
.cm-form input:focus{border-color:var(--primary-2);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.cm-cnt{color:var(--primary)}

/* ===== v2.2 修复：设置组头图标尺寸（此前无约束导致巨型方块撑爆设置页） ===== */
.settings-group .sg-head svg{width:16px;height:16px;flex:none}
.dp-head2 svg{width:16px;height:16px}


@media (max-width:900px){
  #sidebar{width:52px;min-width:52px;padding:10px 6px}
  #sidebar .side-title span,.tree-item span.txt,.tree-item .cnt{display:none}

}

    项目任务看板<span class="ver">v2.2</span>

<script id="core-logic">
/* ================================================================
 * 核心数据层 v2.1（DOM 无关，可被验证脚本独立测试）
 * 模型：Customer → Project(内嵌8阶段实例) → Task
 * 六点修订：四层模型 / 阶段实例化(关键节点阶段级) / 任务标签 /
 *          按项目整体合并 / v2.0 数据自动迁移
 * ================================================================ */
window.KBCore = (function(){
  'use strict';

  function uid(prefix){
    return (prefix||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }
  function now(){ return new Date().toISOString(); }
  function stamp(o){ o.createdAt=o.createdAt||now(); o.updatedAt=now(); o.deletedAt=o.deletedAt||null; return o; }
  function find(list,id){ return list.find(function(x){ return x.id===id; }); }
  function live(list){ return list.filter(function(x){ return !x.deletedAt; }); }
  function todayStr(){
    var d=new Date(); function p(n){return (n<10?'0':'')+n;}
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
  }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function setOf(arr){ var s=new Set(); arr.forEach(function(x){s.add(x.id);}); return s; }

  /* ---------- 全局阶段名库：可增不可减 ---------- */
  var DEFAULT_STAGES = ['商机立项','需求分析','供应商询价','方案评审','招投标','合同签订','项目实施','验收结项'];
  function defaultStages(){
    return DEFAULT_STAGES.map(function(name,i){
      return stamp({ id:uid('stage'), name:name, order:i+1 });
    });
  }
  function addStage(store, name, order){
    name=(name||'').trim();
    if(!name) return {ok:false, reason:'请填写阶段名称'};
    if(live(store.stages).some(function(s){return s.name===name;})) return {ok:false, reason:'阶段名称已存在'};
    var maxOrder=live(store.stages).reduce(function(m,s){return Math.max(m,s.order||0);},0);
    var st=stamp({ id:uid('stage'), name:name, order:(order==null)?(maxOrder+1):order });
    store.stages.push(st);
    syncAllStageInstances(store);
    return {ok:true, stage:st};
  }
  function renameStage(store, stageId, name){
    name=(name||'').trim();
    if(!name) return {ok:false, reason:'阶段名称不能为空'};
    var st=find(store.stages, stageId);
    if(!st) return {ok:false, reason:'阶段不存在'};
    if(live(store.stages).some(function(s){return s.name===name && s.id!==stageId;})) return {ok:false, reason:'阶段名称已存在'};
    st.name=name; st.updatedAt=now();
    return {ok:true};
  }
  function removeStage(store, stageId){ /* 阶段不可删除 */
    return {ok:false, reason:'阶段不可删除（保证流程完整性），仅可新增或改名'};
  }
  function sortedStages(store){
    return live(store.stages).slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
  }
  function firstStageId(store){
    var s=sortedStages(store)[0];
    return s?s.id:null;
  }
  function stageOrderMap(store){
    var m={};
    sortedStages(store).forEach(function(s,i){ m[s.id]=i; });
    return m;
  }

  /* ---------- 标签库（预设 + 自定义自动入库） ---------- */
  var TAG_PALETTE=['#2563eb','#7c3aed','#db2777','#ea580c','#d97706','#16a34a','#0891b2','#475569','#be123c','#65a30d'];
  var DEFAULT_TAG_NAMES=['紧急','对外协调','需领导决策','有依赖','本周重点'];
  function defaultTags(){
    return DEFAULT_TAG_NAMES.map(function(n,i){
      return stamp({ id:uid('tag'), name:n, color:TAG_PALETTE[i%TAG_PALETTE.length], builtin:true });
    });
  }
  function ensureTagByName(store, name){
    name=(name||'').trim(); if(!name) return null;
    var t=live(store.tags).find(function(x){return x.name===name;});
    if(t) return t;
    t=stamp({ id:uid('tag'), name:name, color:TAG_PALETTE[live(store.tags).length%TAG_PALETTE.length], builtin:false });
    store.tags.push(t);
    return t;
  }
  function renameTag(store, tagId, name){
    name=(name||'').trim();
    if(!name) return {ok:false, reason:'标签名称不能为空'};
    var t=find(store.tags, tagId); if(!t) return {ok:false, reason:'标签不存在'};
    if(live(store.tags).some(function(x){return x.name===name && x.id!==tagId;})) return {ok:false, reason:'标签名称已存在'};
    t.name=name; t.updatedAt=now();
    return {ok:true};
  }
  function removeTag(store, tagId){
    var t=find(store.tags, tagId); if(!t) return {ok:false, reason:'标签不存在'};
    t.deletedAt=now(); t.updatedAt=now();
    live(store.tasks).forEach(function(task){
      if((task.tagIds||[]).indexOf(tagId)>=0){
        task.tagIds=(task.tagIds||[]).filter(function(x){return x!==tagId;});
        task.updatedAt=now();
      }
    });
    return {ok:true};
  }
  function tagsOfTask(store, task){
    return (task.tagIds||[]).map(function(id){ return find(store.tags,id); }).filter(Boolean);
  }
  function tagColor(store, tagId){
    var t=find(store.tags, tagId);
    return t?(t.color||'#2563eb'):'#2563eb';
  }

  /* ---------- 任务意见（多人协作评论，每条带提交人） ---------- */
  function commentsOfTask(store, task){
    return (task&&Array.isArray(task.comments))?task.comments:[];
  }
  function addComment(store, taskId, authorId, text){
    text=(text||'').trim();
    if(!text) return {ok:false, reason:'请填写意见内容'};
    var t=find(store.tasks, taskId);
    if(!t) return {ok:false, reason:'任务不存在'};
    if(!Array.isArray(t.comments)) t.comments=[];
    var cm={ id:uid('cm'), authorId:authorId||null, text:text, createdAt:now() };
    t.comments.push(cm);
    t.updatedAt=now();
    return {ok:true, comment:cm};
  }
  function removeComment(store, taskId, commentId){
    var t=find(store.tasks, taskId);
    if(!t||!Array.isArray(t.comments)) return {ok:false, reason:'任务不存在'};
    var before=t.comments.length;
    t.comments=t.comments.filter(function(c){ return c.id!==commentId; });
    if(t.comments.length===before) return {ok:false, reason:'意见不存在'};
    t.updatedAt=now();
    return {ok:true};
  }
  /* 意见列序列化：多条用「；」分隔，每条「成员名：意见内容」 */
  function commentText(store, task){
    return commentsOfTask(store, task).map(function(cm){
      var m=cm.authorId?find(store.members,cm.authorId):null;
      return (m?m.name:'匿名')+'：'+(cm.text||'');
    }).join('；');
  }
  function parseCommentText(store, text){
    var list=[];
    (text||'').split('；').forEach(function(seg){
      seg=(seg||'').trim(); if(!seg) return;
      var i=seg.indexOf('：')>=0?seg.indexOf('：'):seg.indexOf(':');
      var name='', body=seg;
      if(i>0){ name=seg.slice(0,i).trim(); body=seg.slice(i+1).trim(); }
      var mid=name?ensureMemberByName(store, name, 'internal'):null;
      list.push({ id:uid('cm'), authorId:mid, text:body, createdAt:now() });
    });
    return list;
  }

  /* ---------- 初始数据 ---------- */
  function freshStore(){
    return { version:2.2, customers:[], members:[], projects:[], tasks:[],
             stages:defaultStages(), tags:defaultTags() };
  }

  /* ---------- 任务状态 ---------- */
  var STATUS = { todo:'未开始', doing:'进行中', done:'已完成', risk:'有风险' };
  function statusLabel(s){ return STATUS[s]||STATUS.todo; }
  function isOverdue(task, today){
    return !!(task.planDate && task.planDate < (today||todayStr()) && task.status!=='done');
  }

  /* ---------- 阶段实例（每项目 8 个，含阶段级关键节点） ---------- */
  function stageInstances(p){ return (p&&Array.isArray(p.stages))?p.stages:[]; }
  function stageInstance(p, stageId){
    return stageInstances(p).find(function(s){ return s.stageId===stageId; })||null;
  }
  function keyMilestoneOf(p, stageId){
    var inst=stageInstance(p, stageId);
    return inst?(inst.keyMilestone||''):'';
  }
  function ensureStageInstances(store, p){
    if(!Array.isArray(p.stages)) p.stages=[];
    var have={};
    p.stages.forEach(function(s){ have[s.stageId]=1; });
    sortedStages(store).forEach(function(sn){
      if(!have[sn.id]){
        /* v2.0 旧任务 keyMilestone 迁移：取该阶段第一个非空值 */
        var legacy='';
        var ts=live(store.tasks).filter(function(t){ return t.projectId===p.id && t.stageId===sn.id; });
        for(var i=0;i<ts.length;i++){ if(ts[i]&&ts[i].keyMilestone){ legacy=ts[i].keyMilestone; break; } }
        p.stages.push({ stageId:sn.id, keyMilestone:legacy });
      }
    });
    var o=stageOrderMap(store);
    p.stages.sort(function(a,b){ return (o[a.stageId]||0)-(o[b.stageId]||0); });
    return p.stages;
  }
  function syncAllStageInstances(store){
    live(store.projects).forEach(function(p){ ensureStageInstances(store,p); });
  }
  function setKeyMilestone(store, projectId, stageId, value){
    var p=find(store.projects, projectId);
    if(!p) return {ok:false, reason:'项目不存在'};
    ensureStageInstances(store, p);
    var inst=stageInstance(p, stageId);
    if(!inst) return {ok:false, reason:'阶段不存在'};
    inst.keyMilestone=(value||'').trim();
    p.updatedAt=now();
    return {ok:true, keyMilestone:inst.keyMilestone};
  }

  /* ---------- 当前阶段（手动锁定优先，自动推导为最靠后有任务阶段） ---------- */
  function tasksOfProject(store, projectId){
    return live(store.tasks).filter(function(t){ return t.projectId===projectId; });
  }
  function latestTaskStageId(store, projectId){
    var ts=tasksOfProject(store, projectId);
    if(!ts.length) return null;
    var order=stageOrderMap(store);
    var best=null, bestOrd=-1;
    ts.forEach(function(t){
      var o=order[t.stageId]||0;
      if(o>bestOrd){ bestOrd=o; best=t.stageId; }
    });
    return best;
  }
  function currentStageIdOf(store, p){
    if(!p) return null;
    if(p.currentStageId && live(store.stages).some(function(s){return s.id===p.currentStageId;})){
      return p.currentStageId;
    }
    return latestTaskStageId(store, p.id) || firstStageId(store);
  }

  /* ---------- 项目 / 阶段统计 ---------- */
  function projectStats(store, projectId, today){
    var ts=tasksOfProject(store, projectId);
    var done=ts.filter(function(t){return t.status==='done';}).length;
    var risk=ts.filter(function(t){return t.status==='risk';}).length;
    var overdue=ts.filter(function(t){return isOverdue(t, today);}).length;
    return { total:ts.length, done:done, risk:risk, overdue:overdue };
  }
  function stageStats(store, projectId, stageId, today){
    var ts=tasksOfProject(store, projectId).filter(function(t){ return t.stageId===stageId; });
    var done=ts.filter(function(t){return t.status==='done';}).length;
    var risk=ts.filter(function(t){return t.status==='risk';}).length;
    var overdue=ts.filter(function(t){return isOverdue(t, today);}).length;
    return { total:ts.length, done:done, risk:risk, overdue:overdue };
  }
  function stagePhase(stats){
    if(!stats||!stats.total) return 'empty';
    if(stats.risk||stats.overdue) return 'risk';
    if(stats.done===stats.total) return 'done';
    return 'doing';
  }
  var PHASE_LABEL={ done:'已完成', risk:'有风险', doing:'进行中', empty:'未开始' };

  /* ---------- 校验 ---------- */
  function uniqueName(list, name, excludeId){
    name=(name||'').trim();
    return !live(list).some(function(x){ return x.name===name && x.id!==excludeId; });
  }

  /* ---------- 级联删除（软删） ---------- */
  function softDel(o){ if(o){ o.deletedAt=now(); o.updatedAt=now(); } }
  function removeCustomer(store, customerId){
    live(store.projects).filter(function(p){return p.customerId===customerId;}).forEach(function(p){ removeProject(store,p.id); });
    softDel(find(store.customers,customerId));
  }
  function removeProject(store, projectId){
    live(store.tasks).filter(function(t){return t.projectId===projectId;}).forEach(softDel);
    softDel(find(store.projects,projectId));
  }

  /* ---------- 成员交叉 ---------- */
  function projectsOfMember(store, memberId){
    return live(store.projects).filter(function(p){
      return p.leaderId===memberId || (p.memberIds||[]).indexOf(memberId)>=0 || p.ownerContactId===memberId;
    });
  }
  function tasksOfAssignee(store, memberId){
    return live(store.tasks).filter(function(t){ return t.assigneeId===memberId; });
  }
  function roleInProject(p, memberId){
    if(p.leaderId===memberId) return '总负责人';
    if(p.ownerContactId===memberId) return '甲方联系人';
    if((p.memberIds||[]).indexOf(memberId)>=0) return '项目组成员';
    return '';
  }

  /* ---------- 按项目整体合并 ---------- */
  function projFingerprint(p){
    var e=clone(p);
    delete e.updatedAt; delete e.createdAt; delete e.deletedAt;
    return JSON.stringify(e);
  }
  function taskFingerprint(t){
    var e=clone(t);
    delete e.updatedAt; delete e.createdAt; delete e.deletedAt;
    delete e.projectId;
    return JSON.stringify(e);
  }
  function tasksFingerprint(store, projectId, list){
    return (list||[]).filter(function(t){ return t.projectId===projectId; })
      .map(taskFingerprint).sort().join('|');
  }
  function mergeByProject(local, incoming){
    var stats={ updated:0, added:0, kept:0, orphans:0, orphanIds:[], projectsUpdated:[], projectsAdded:[] };
    if(!incoming||!Array.isArray(incoming.projects)||!Array.isArray(incoming.tasks)) return stats;

    /* 名库合并：按 id → 按名称对齐（避免默认阶段重复）；建立 stage 引用重映射 */
    var stageRemap={};
    (incoming.stages||[]).forEach(function(sn){
      if(!sn||!sn.id) return;
      var ex=find(local.stages,sn.id);
      if(!ex) ex=live(local.stages).find(function(x){ return x.name===sn.name; });
      if(!ex){ local.stages.push(clone(sn)); }
      else {
        if(ex.id!==sn.id) stageRemap[sn.id]=ex.id;
        if(sn.name&&sn.name!==ex.name){ ex.name=sn.name; ex.updatedAt=now(); }
      }
    });

    /* 标签库合并：同 id 补入；同名不同 id 建立重映射 */
    var tagRemap={};
    (incoming.tags||[]).forEach(function(tg){
      if(!tg||!tg.id) return;
      var ex=find(local.tags,tg.id);
      if(ex){ return; }
      var same=live(local.tags).find(function(x){ return x.name===tg.name; });
      if(same){ tagRemap[tg.id]=same.id; }
      else { local.tags.push(clone(tg)); }
    });

    /* 成员合并：按 id → 按 name+kind → 新建 */
    var memMap={};
    (incoming.members||[]).forEach(function(m){
      if(!m||!m.id) return;
      var ex=find(local.members,m.id);
      if(ex){ memMap[m.id]=ex.id; return; }
      var same=live(local.members).find(function(x){ return x.name===m.name && x.kind===m.kind; });
      if(same){ memMap[m.id]=same.id; return; }
      local.members.push(clone(m)); memMap[m.id]=m.id;
    });

    /* 客户合并：按 id → 按名称 */
    var custMap={};
    (incoming.customers||[]).forEach(function(c){
      if(!c||!c.id) return;
      var ex=find(local.customers,c.id);
      if(!ex) ex=live(local.customers).find(function(x){ return x.name===c.name; });
      if(!ex){ ex=stamp({id:c.id,name:c.name||'未命名客户',description:c.description||''}); local.customers.push(ex); }
      custMap[c.id]=ex.id;
    });

    function remapStageRefs(rec){
      if(Array.isArray(rec.stages)){
        rec.stages.forEach(function(si){ if(stageRemap[si.stageId]) si.stageId=stageRemap[si.stageId]; });
      }
      if(rec.currentStageId&&stageRemap[rec.currentStageId]) rec.currentStageId=stageRemap[rec.currentStageId];
    }

    /* 项目整体替换 / 新增 / 内容一致保留 */
    var incTasks=incoming.tasks;
    var beforeCount=live(local.projects).length;
    incoming.projects.forEach(function(ip){
      if(!ip||!ip.id) return;
      var target=null;
      var ex=find(local.projects, ip.id);
      if(ex) target=ex;
      else {
        var cid=custMap[ip.customerId]||ip.customerId;
        target=live(local.projects).find(function(x){ return x.customerId===cid && x.name===ip.name; });
      }
      if(target){
        /* 内容一致（项目 + 任务）→ 视为未涉及保留 */
        if(projFingerprint(target)===projFingerprint(ip) &&
           tasksFingerprint(local, target.id, local.tasks)===tasksFingerprint(local, target.id, incTasks)){
          stats.kept++;
          return;
        }
      }
      var isNew=!target;
      var rec=clone(ip);
      remapStageRefs(rec);
      if(rec.customerId&&custMap[rec.customerId]) rec.customerId=custMap[rec.customerId];
      if(isNew){
        local.projects.push(rec);
        stats.added++; stats.projectsAdded.push(rec.name);
      } else {
        var idx=local.projects.indexOf(target);
        local.projects[idx]=rec;
        stats.updated++; stats.projectsUpdated.push(rec.name);
      }
      if(rec.deletedAt){ rec.deletedAt=null; }
      /* 该项目旧任务整体软删，插入导入任务（按项目整体为准） */
      live(local.tasks).filter(function(t){ return t.projectId===rec.id; }).forEach(function(t){
        t.deletedAt=now(); t.updatedAt=now();
      });
      incTasks.filter(function(t){ return t.projectId===ip.id; }).forEach(function(t){
        if(!t||!t.id) return;
        var nt=clone(t);
        nt.projectId=rec.id;
        if(nt.assigneeId&&memMap[nt.assigneeId]) nt.assigneeId=memMap[nt.assigneeId];
        if(Array.isArray(nt.tagIds)){
          nt.tagIds=nt.tagIds.map(function(tid){ return tagRemap[tid]||tid; }).filter(Boolean);
        } else { nt.tagIds=[]; }
        if(stageRemap[nt.stageId]) nt.stageId=stageRemap[nt.stageId];
        local.tasks.push(nt);
      });
      ensureStageInstances(local, rec);
    });
    stats.kept=Math.max(stats.kept, live(local.projects).length - stats.updated - stats.added);
    if(beforeCount===0 && stats.added===0) stats.kept=0;

    /* 孤儿检测（引用断裂） */
    var pids=setOf(live(local.projects));
    var sids=setOf(live(local.stages));
    var aids=setOf(live(local.members));
    live(local.tasks).forEach(function(t){
      if(!pids.has(t.projectId)||!sids.has(t.stageId)){ stats.orphans++; stats.orphanIds.push(t.id); }
      else if(t.assigneeId&&!aids.has(t.assigneeId)){ stats.orphans++; stats.orphanIds.push(t.id); }
    });
    var cids=setOf(live(local.customers));
    live(local.projects).forEach(function(p){
      if(!cids.has(p.customerId)){ stats.orphans++; stats.orphanIds.push(p.id); }
    });
    return stats;
  }

  /* ---------- JSON 导入导出（projectIds 可选：按项目筛选导出） ---------- */
  function exportJson(store, projectIds){
    var projects=store.projects, tasks=store.tasks;
    if(Array.isArray(projectIds)&&projectIds.length){
      var set=new Set(projectIds);
      projects=projects.filter(function(p){ return set.has(p.id)&&!p.deletedAt; });
      tasks=store.tasks.filter(function(t){ return set.has(t.projectId)&&!t.deletedAt; });
    }
    return JSON.stringify({
      meta:{schemaVersion:2.1, exportedAt:now(), app:'project-kanban-v2.1'},
      stages:store.stages, tags:store.tags, customers:store.customers,
      members:store.members, projects:projects, tasks:tasks
    }, null, 1);
  }
  function importJson(store, text){
    var data;
    try{ data=JSON.parse(text); }catch(e){ return {ok:false, reason:'JSON 解析失败: '+e.message}; }
    if(!data||!Array.isArray(data.projects)||!Array.isArray(data.tasks)) return {ok:false, reason:'文件格式不正确（缺少 projects/tasks 数组）'};
    var stats=mergeByProject(store, data);
    syncAllStageInstances(store);
    return {ok:true, stats:stats};
  }

  /* ---------- CSV ---------- */
  function csvEscape(v){
    v=(v===null||v===undefined)?'':String(v);
    return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  }
  function csvLine(arr){ return arr.map(csvEscape).join(','); }
  function memberName(store,id){ if(!id) return ''; var m=find(store.members,id); return m?m.name:''; }
  function stageName(store,id){ var s=find(store.stages,id); return s?s.name:''; }
  function customerNameOf(store,customerId){ var c=find(store.customers,customerId); return c?c.name:''; }
  function tagNameList(store, task){
    return tagsOfTask(store, task).map(function(t){ return t.name; }).join('、');
  }
  function exportProjectsCsv(store){
    var lines=[];
    lines.push(csvLine(['id','客户','项目名称','承接单位','建设单位','建设单位联系人','项目总负责人','项目组成员','项目概况','补充说明','当前阶段锁定','更新时间']));
    live(store.projects).forEach(function(p){
      lines.push(csvLine([p.id, customerNameOf(store,p.customerId), p.name,
        p.undertaker||'', p.owner||'', memberName(store,p.ownerContactId), memberName(store,p.leaderId),
        (p.memberIds||[]).map(function(m){return memberName(store,m);}).join('、'),
        p.overview||'', p.remarks||'',
        p.currentStageId?stageName(store,p.currentStageId):'',
        p.updatedAt||'']));
    });
    return lines.join('\n');
  }
  function exportStagesCsv(store){
    var lines=[];
    lines.push(csvLine(['id','项目','阶段','关键节点','更新时间']));
    live(store.projects).forEach(function(p){
      ensureStageInstances(store,p);
      stageInstances(p).forEach(function(inst){
        lines.push(csvLine([inst.stageId, p.name, stageName(store,inst.stageId), inst.keyMilestone||'', p.updatedAt||'']));
      });
    });
    return lines.join('\n');
  }
  function exportTasksCsv(store){
    var lines=[];
    lines.push(csvLine(['id','项目','阶段','任务','计划时间','实际时间','状态','交付物','责任人','标签','意见','更新时间']));
    live(store.tasks).forEach(function(t){
      var p=find(store.projects,t.projectId);
      lines.push(csvLine([t.id, p?p.name:'', stageName(store,t.stageId), t.name,
        t.planDate||'', t.actualDate||'', statusLabel(t.status), t.deliverable||'',
        memberName(store,t.assigneeId), tagNameList(store,t), commentText(store,t), t.updatedAt||'']));
    });
    return lines.join('\n');
  }
  function parseCsv(text){
    var rows=[], row=[], cur='', q=false;
    for(var i=0;i<text.length;i++){
      var ch=text[i];
      if(q){
        if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
        else cur+=ch;
      } else {
        if(ch==='"') q=true;
        else if(ch===','){ row.push(cur); cur=''; }
        else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
        else if(ch!=='\r') cur+=ch;
      }
    }
    if(cur!==''||row.length){ row.push(cur); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(x){ return String(x).trim()!==''; }); });
  }
  function mkGetter(rows, i){
    var head=rows[0].map(function(h){return String(h).trim();});
    var idx={}; head.forEach(function(h,j){ idx[h]=j; });
    return function(k){ return (idx[k]===undefined)?'':String(rows[i][idx[k]]||'').trim(); };
  }
  function ensureMemberByName(store, name, kind){
    if(!name) return null;
    var m=live(store.members).find(function(x){return x.name===name;});
    if(!m){ m=stamp({id:uid('mem'),name:name,kind:kind||'internal',org:'',note:''}); store.members.push(m); }
    return m.id;
  }
  function ensureCustomerByName(store, name){
    var c=live(store.customers).find(function(x){return x.name===name;});
    if(!c){ c=stamp({id:uid('cust'),name:name,description:''}); store.customers.push(c); }
    return c.id;
  }
  /* 项目 CSV：更新涉及项目的项目字段（按项目合并——不涉及的项目不动） */
  function importProjectsCsv(store, rows){
    var added=0, updated=0;
    for(var i=1;i<rows.length;i++){
      var get=mkGetter(rows, i);
      var pname=get('项目名称'); if(!pname) continue;
      var custId=ensureCustomerByName(store, get('客户')||'未分组客户');
      var lockName=get('当前阶段锁定');
      var lockStage=lockName?live(store.stages).find(function(s){return s.name===lockName;}):null;
      var proj=live(store.projects).find(function(p){return p.customerId===custId&&p.name===pname;});
      var payload={
        undertaker:get('承接单位')||'', owner:get('建设单位')||'',
        ownerContactId:ensureMemberByName(store, get('建设单位联系人'),'external')||null,
        leaderId:ensureMemberByName(store, get('项目总负责人'),'internal')||null,
        memberIds:get('项目组成员').split('、').filter(Boolean).map(function(n){return ensureMemberByName(store,n,'internal');}).filter(Boolean),
        overview:get('项目概况')||'', remarks:get('补充说明')||'',
        currentStageId: lockStage?lockStage.id:null
      };
      if(!proj){
        proj=stamp({id:uid('proj'),customerId:custId,name:pname});
        Object.keys(payload).forEach(function(k){ proj[k]=payload[k]; });
        store.projects.push(proj); added++;
      } else {
        Object.keys(payload).forEach(function(k){ proj[k]=payload[k]; });
        proj.updatedAt=now(); updated++;
      }
      ensureStageInstances(store, proj);
    }
    return {added:added, updated:updated};
  }
  /* 阶段 CSV：更新涉及项目的阶段关键节点 */
  function importStagesCsv(store, rows){
    var updated=0;
    for(var i=1;i<rows.length;i++){
      var get=mkGetter(rows, i);
      var pname=get('项目'); var sname=get('阶段'); if(!pname||!sname) continue;
      var proj=live(store.projects).find(function(p){return p.name===pname;});
      if(!proj) continue;
      var st=live(store.stages).find(function(s){return s.name===sname;});
      if(!st) continue;
      var r=setKeyMilestone(store, proj.id, st.id, get('关键节点'));
      if(r.ok) updated++;
    }
    return {updated:updated};
  }
  /* 任务 CSV：出现于 CSV 的项目，其任务整体以 CSV 为准（按项目合并） */
  function importTasksCsv(store, rows){
    var statusMap={};
    Object.keys(STATUS).forEach(function(k){ statusMap[STATUS[k]]=k; });
    var byProject={};
    for(var i=1;i<rows.length;i++){
      var get=mkGetter(rows, i);
      var tname=get('任务'); var pname=get('项目'); if(!tname||!pname) continue;
      if(!byProject[pname]) byProject[pname]=[];
      byProject[pname].push(get);
    }
    var projectsReplaced=0, tasksAdded=0, skipped=0;
    Object.keys(byProject).forEach(function(pname){
      var proj=live(store.projects).find(function(p){return p.name===pname;});
      if(!proj){ skipped+=byProject[pname].length; return; }
      live(store.tasks).filter(function(t){return t.projectId===proj.id;}).forEach(function(t){
        t.deletedAt=now(); t.updatedAt=now();
      });
      byProject[pname].forEach(function(get){
        var stageNm=get('阶段');
        var stage=stageNm?live(store.stages).find(function(s){return s.name===stageNm;}):null;
        var tagIds=get('标签')?get('标签').split('、').filter(Boolean).map(function(n){
          var tg=ensureTagByName(store,n); return tg?tg.id:null;
        }).filter(Boolean):[];
        var comments=parseCommentText(store, get('意见'));
        store.tasks.push(C_stamp({
          id:uid('task'), projectId:proj.id,
          stageId: stage?stage.id:(currentStageIdOf(store,proj)||firstStageId(store)),
          name:get('任务'), planDate:get('计划时间')||'', actualDate:get('实际时间')||'',
          status: statusMap[get('状态')]||'todo', deliverable:get('交付物')||'',
          assigneeId: ensureMemberByName(store, get('责任人'),'internal')||null,
          tagIds: tagIds,
          comments: comments
        }));
        tasksAdded++;
      });
      projectsReplaced++;
    });
    return {projects:projectsReplaced, tasks:tasksAdded, skipped:skipped};
  }
  function C_stamp(o){ return stamp(o); }

  /* ---------- v2.0 → v2.1 数据迁移（幂等） ---------- */
  function migrate(store){
    if(!store) return false;
    var changed=false;
    if(!Array.isArray(store.tags)||!store.tags.length){ store.tags=defaultTags(); changed=true; }
    if(Array.isArray(store.groups)&&store.groups.length){
      /* 项目群层移除：项目归入其原所属客户 */
      live(store.projects).forEach(function(p){
        if(p.groupId){
          var g=find(store.groups,p.groupId);
          if(g){ p.customerId=g.customerId; }
        }
        delete p.groupId;
      });
      store.groups=[];
      changed=true;
    }
    live(store.projects).forEach(function(p){
      if(!Array.isArray(p.stages)) { p.stages=[]; changed=true; }
      if(p.stageId!==undefined){ p.currentStageId=p.stageId; delete p.stageId; changed=true; }
      var before=JSON.stringify(p.stages);
      ensureStageInstances(store, p);
      if(JSON.stringify(p.stages)!==before) changed=true;
    });
    live(store.tasks).forEach(function(t){
      if(t.keyMilestone!==undefined){ delete t.keyMilestone; changed=true; }
      if(!Array.isArray(t.tagIds)){ t.tagIds=[]; changed=true; }
      if(!Array.isArray(t.comments)){ t.comments=[]; changed=true; }
    });
    if(store.version!==2.2){ store.version=2.2; changed=true; }
    return changed;
  }

  return {
    uid:uid, now:now, stamp:stamp, find:find, live:live, todayStr:todayStr, clone:clone,
    DEFAULT_STAGES:DEFAULT_STAGES, defaultStages:defaultStages,
    addStage:addStage, renameStage:renameStage, removeStage:removeStage,

    TAG_PALETTE:TAG_PALETTE, DEFAULT_TAG_NAMES:DEFAULT_TAG_NAMES, defaultTags:defaultTags,
    ensureTagByName:ensureTagByName, renameTag:renameTag, removeTag:removeTag,
    tagsOfTask:tagsOfTask, tagColor:tagColor,
    commentsOfTask:commentsOfTask, addComment:addComment, removeComment:removeComment,
    commentText:commentText, parseCommentText:parseCommentText,
    freshStore:freshStore, STATUS:STATUS, statusLabel:statusLabel, isOverdue:isOverdue,
    stageInstances:stageInstances, stageInstance:stageInstance, keyMilestoneOf:keyMilestoneOf,
    ensureStageInstances:ensureStageInstances, syncAllStageInstances:syncAllStageInstances,
    setKeyMilestone:setKeyMilestone,
    tasksOfProject:tasksOfProject, latestTaskStageId:latestTaskStageId, currentStageIdOf:currentStageIdOf,
    projectStats:projectStats, stageStats:stageStats, stagePhase:stagePhase, PHASE_LABEL:PHASE_LABEL,
    uniqueName:uniqueName,
    removeCustomer:removeCustomer, removeProject:removeProject,
    projectsOfMember:projectsOfMember, tasksOfAssignee:tasksOfAssignee, roleInProject:roleInProject,
    mergeByProject:mergeByProject, importJson:importJson, exportJson:exportJson,
    exportProjectsCsv:exportProjectsCsv, exportStagesCsv:exportStagesCsv, exportTasksCsv:exportTasksCsv,
    parseCsv:parseCsv, importProjectsCsv:importProjectsCsv, importStagesCsv:importStagesCsv, importTasksCsv:importTasksCsv,
    memberName:memberName, stageName:stageName, customerNameOf:customerNameOf, tagNameList:tagNameList,
    migrate:migrate
  };
})();

  }/* ---------- Toast / Modal / Menu ---------- */
  function toast(msg,type){
    var el=document.createElement('div');
    el.className='toast '+(type||'');
    el.textContent=msg;
    $('#toasts').appendChild(el);
    setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(function(){el.remove();},320); },2600);
  }
  function openModal(html, cls){
    $('#modalBox').innerHTML=html;
    $('#modalBox').className='modal '+(cls||'');
    $('#modalMask').classList.add('show');
  }
  function closeModal(){ $('#modalMask').classList.remove('show'); }
  $('#modalMask').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
  function confirmBox(title, text, onYes, danger){
    openModal(
      '<div class="modal-head"><h3>'+esc(title)+'</h3><button class="modal-x" data-close>'+ICON.x+'</button></div>'+
      '<div class="modal-body"><div class="confirm-text">'+text+'</div></div>'+
      '<div class="modal-foot"><button class="btn" data-close>取消</button><button class="btn '+(danger?'danger':'primary')+'" id="confirmYes">确认</button></div>','sm');
    $('#confirmYes').onclick=function(){ closeModal(); onYes&&onYes(); };
  }
  document.addEventListener('click', function(e){
    if(e.target.closest('[data-close]')) closeModal();
    if(!e.target.closest('#menu')) $('#menu').classList.remove('show');
  });
  var menuCtx=null;
  function openMenu(x,y,items){
    var m=$('#menu');
    m.innerHTML=items.map(function(it){
      return '<button class="menu-item'+(it.danger?' danger':'')+'" data-act="'+esc(it.act)+'">'+(it.icon||'')+esc(it.label)+'</button>';
    }).join('');
    m.classList.add('show');
    var r=m.getBoundingClientRect();
    m.style.left=Math.min(x, window.innerWidth-r.width-8)+'px';
    m.style.top=Math.min(y, window.innerHeight-r.height-8)+'px';
    m.querySelectorAll('[data-act]').forEach(function(b){
      b.addEventListener('click', function(){
        m.classList.remove('show');
        menuCtx&&menuCtx[b.getAttribute('data-act')]&&menuCtx[b.getAttribute('data-act')]();
      });
    });
  }

  /* ---------- 范围与过滤 ---------- */
  function scopeCustomers(){ return C.live(store.customers); }
  function scopeProjects(){
    var ps=C.live(store.projects);
    if(scope.customerId){ ps=ps.filter(function(p){return p.customerId===scope.customerId;}); }
    if(searchKw){
      var kw=searchKw.toLowerCase();
      var pids=new Set();
      C.live(store.tasks).forEach(function(t){
        if(t.name.toLowerCase().indexOf(kw)>=0||(t.deliverable||'').toLowerCase().indexOf(kw)>=0){
          pids.add(t.projectId);
        }
      });
      C.live(store.tags).forEach(function(tg){
        if(tg.name.toLowerCase().indexOf(kw)>=0){
          C.live(store.tasks).forEach(function(t){
            if((t.tagIds||[]).indexOf(tg.id)>=0) pids.add(t.projectId);
          });
        }
      });
      ps=ps.filter(function(p){
        return p.name.toLowerCase().indexOf(kw)>=0||pids.has(p.id);
      });
    }
    return ps;
  }
  function scopeTasks(){
    var pids=new Set(scopeProjects().map(function(p){return p.id;}));
    var ts=C.live(store.tasks).filter(function(t){return pids.has(t.projectId);});
    if(searchKw){
      var kw=searchKw.toLowerCase();
      var tagIds=new Set();
      C.live(store.tags).forEach(function(tg){ if(tg.name.toLowerCase().indexOf(kw)>=0) tagIds.add(tg.id); });
      ts=ts.filter(function(t){
        var p=C.find(store.projects,t.projectId);
        return t.name.toLowerCase().indexOf(kw)>=0||
          (t.deliverable||'').toLowerCase().indexOf(kw)>=0||
          (p&&p.name.toLowerCase().indexOf(kw)>=0)||
          (t.tagIds||[]).some(function(id){return tagIds.has(id);});
      });
    }
    return ts;
  }
  function scopeLabel(){
    if(scope.customerId){ var c=C.find(store.customers,scope.customerId); return c?c.name:''; }
    return '全部客户';
  }

  /* ---------- 导航 ---------- */

    {id:'dashboard',label:'仪表盘',icon:ICON.dash},
    {id:'project',  label:'项目看板',icon:ICON.board},

    var box=$('#tree'); var html='';
    var customers=scopeCustomers();
    var multiCust=customers.length>1;
    customers.forEach(function(c){
      var ps=C.live(store.projects).filter(function(p){return p.customerId===c.id;});
      if(multiCust){
        /* 多客户：客户仅作分组小标题（一层项目为主） */
        html+='<div class="tree-group" data-custgrp="'+esc(c.id)+'">'+
          ICON.building+'<span class="txt">'+esc(c.name)+'</span><span class="cnt">'+ps.length+'</span>'+
          '<span class="ops"><button data-op="edit-cust" data-id="'+esc(c.id)+'" title="编辑客户">'+ICON.edit+'</button>'+
          '<button data-op="del-cust" data-id="'+esc(c.id)+'" title="删除客户">'+ICON.trash+'</button></span></div>';
      }
      ps.forEach(function(p){
        html+='<div class="tree-item proj'+(selectedProjectId===p.id?' active':'')+'" data-proj="'+esc(p.id)+'" title="'+esc(p.name)+'">'+
          ICON.box+'<span class="txt">'+esc(p.name)+'</span>'+
          '<span class="ops"><button data-op="edit-proj" data-id="'+esc(p.id)+'" title="编辑项目">'+ICON.edit+'</button>'+
          '<button data-op="del-proj" data-id="'+esc(p.id)+'" title="删除项目">'+ICON.trash+'</button></span></div>';
      });
    });
    if(!C.live(store.projects).length){ html='<div style="color:#b7c5d8;font-size:12px;padding:10px 8px;">暂无项目，点下方新建</div>'; }
    box.innerHTML=html;
    box.querySelectorAll('[data-proj]').forEach(function(el){
      el.addEventListener('click', function(){
        var pid=el.getAttribute('data-proj');
        selectedProjectId=pid; view='project';
        renderTree(); renderMain();
      });
    });
    box.querySelectorAll('[data-op]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        var op=el.getAttribute('data-op'); var id=el.getAttribute('data-id');
        if(op==='edit-cust') openCustomerForm(id);
        if(op==='del-cust'){
          confirmBox('删除客户','将级联删除该客户下所有项目与任务，不可恢复。确认删除 <b>'+esc((C.find(store.customers,id)||{}).name||'')+'</b>？',
            function(){ C.removeCustomer(store,id); save(); renderAll(); toast('已删除客户','ok'); }, true);
        }
        if(op==='edit-proj') openProjectEditForm(id);
        if(op==='del-proj'){
          confirmBox('删除项目','将级联删除该项目全部阶段与任务。确认删除 <b>'+esc((C.find(store.projects,id)||{}).name||'')+'</b>？',
            function(){ C.removeProject(store,id); if(selectedProjectId===id) selectedProjectId=null; save(); renderAll(); toast('已删除项目','ok'); }, true);
        }
      });
    });
    $('#btnCollapseTree').onclick=function(){ scope={customerId:null}; renderTree(); renderMain(); };
  }

  function renderAll(){ renderTabs(); renderTree(); renderMain(); }
  function renderMain(){

  function renderTaskBoard(main){
    var projects=scopeProjects();

      main.innerHTML='<div class="page-head"><h2>任务看板</h2></div><div class="empty-box" style="margin-top:40px;">还没有项目。</div>';
      return;

    var stages=C.sortedStages(store);
    var curP=null;
    if(!taskBoardAll){
      curP=C.find(store.projects,selectedProjectId)||projects[0];
    }
    var tasks=curP?C.tasksOfProject(store,curP.id):scopeTasks();
    var buckets={};
    stages.forEach(function(s){ buckets[s.id]=[]; });
    tasks.forEach(function(t){ (buckets[t.stageId]=buckets[t.stageId]||[]).push(t); });
    var html='<div class="page-head"><h2>任务看板</h2><span class="crumb">'+esc(scopeLabel())+'</span><span class="spacer"></span>'+
      '<span class="pill">'+stages.length+' 个阶段 · '+tasks.length+' 个任务</span></div>'+
      '<div class="tb-toggle">'+
        '<button class="'+(taskBoardAll?'':'on')+'" data-tb-toggle="0">'+(curP?'跟随项目：'+esc(curP.name):'跟随项目')+'</button>'+
        '<button class="'+(taskBoardAll?'on':'')+'" data-tb-toggle="1">全部项目</button>'+
      '</div><div class="kanban">';
    stages.forEach(function(s,si){
      var list=buckets[s.id]||[];

  /* ---------- 拖拽（任务卡） ---------- */
  var dragData=null;
  function bindDragDrop(){
    $$('.kcard').forEach(function(card){
      card.addEventListener('dragstart', function(e){
        dragData={type:card.getAttribute('data-type'), id:card.getAttribute('data-id')};
        card.classList.add('dragging');
        try{ e.dataTransfer.setData('text/plain', dragData.id); e.dataTransfer.effectAllowed='move'; }catch(err){}
      });
      card.addEventListener('dragend', function(){
        card.classList.remove('dragging');
        $$('.drag-over').forEach(function(el){el.classList.remove('drag-over');});
      });
    });
    $$('[data-drop]').forEach(function(drop){
      drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('drag-over'); });
      drop.addEventListener('dragleave', function(){ drop.classList.remove('drag-over'); });
      drop.addEventListener('drop', function(e){
        e.preventDefault(); drop.classList.remove('drag-over');
        if(!dragData) return;
        if(dragData.type==='task'){
          var t=C.find(store.tasks,dragData.id);
          if(t&&C.live(store.stages).some(function(s){return s.id===drop.getAttribute('data-drop');})){
            t.stageId=drop.getAttribute('data-drop');
            t.updatedAt=C.now();
            save(); renderAll(); toast('任务阶段已更新','ok');
          }
        }
      });
    });

  function bindCommentSection(t){

      if(!aid){ toast('请选择提交人','err'); return; }
      if(!text){ toast('请填写意见内容','err'); return; }
      var r=C.addComment(store,t.id,aid,text);
      if(!r.ok){ toast(r.reason,'err'); return; }
      try{ localStorage.setItem('kb_last_author',aid); }catch(e){}
      save(); refresh(); renderMain();
      toast('意见已提交（'+(C.find(store.members,aid)||{}).name+'）','ok');
    };
    var inp=$('#cmText');
    if(inp){ inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); btn.click(); } }); }
    $$('[data-cmdel]').forEach(function(el){
      el.onclick=function(e){
        e.stopPropagation();

        save(); refresh(); renderMain();

    });
