    html+='<div class="settings-group dm-hero"><div class="sg-head">'+ICON.download+'数据导出（分发给成员线下整理）</div><div class="sg-body">'+
      '<div class="dm-grid">'+
        '<button class="dm-btn primary" id="btnExpJson"><span class="dm-ic">'+ICON.download+'</span><span class="dm-tx"><span class="dm-t">JSON 完整备份</span><span class="dm-d">全部数据一键备份，含意见与标签</span></span></button>'+
        '<button class="dm-btn primary" id="btnExpPick"><span class="dm-ic">'+ICON.download+'</span><span class="dm-tx"><span class="dm-t">按项目筛选导出</span><span class="dm-d">导出部分项目给对应成员整理（推荐）</span></span></button>'+
        '<button class="dm-btn" id="btnExpTaskCsv"><span class="dm-ic">'+ICON.list+'</span><span class="dm-tx"><span class="dm-t">任务表格 CSV</span><span class="dm-d">项目/阶段/时间/状态/标签/意见</span></span></button>'+
        '<button class="dm-btn" id="btnExpProjCsv"><span class="dm-ic">'+ICON.box+'</span><span class="dm-tx"><span class="dm-t">项目表格 CSV</span><span class="dm-d">项目表头字段一览</span></span></button>'+
        '<button class="dm-btn" id="btnExpStageCsv"><span class="dm-ic">'+ICON.flag+'</span><span class="dm-tx"><span class="dm-t">阶段表格 CSV</span><span class="dm-d">各项目阶段关键节点</span></span></button>'+
      '</div>'+
      '<div class="hint-line">CSV 表格可用 Excel / WPS 直接打开编辑；多人协作建议用「按项目筛选导出」分发，成员整理后收回导入。</div>'+
      '</div></div>';
    /* ===== 数据导入（置顶） ===== */
    html+='<div class="settings-group dm-hero"><div class="sg-head">'+ICON.upload+'数据导入（按项目整体合并更新）</div><div class="sg-body">'+
      '<div class="dm-grid">'+
        '<button class="dm-btn primary" id="btnImpJson"><span class="dm-ic">'+ICON.upload+'</span><span class="dm-tx"><span class="dm-t">导入 JSON</span><span class="dm-d">完整数据合并，含任务意见</span></span></button>'+
        '<button class="dm-btn" id="btnImpTaskCsv"><span class="dm-ic">'+ICON.list+'</span><span class="dm-tx"><span class="dm-t">导入任务表格 CSV</span><span class="dm-d">整体替换涉及项目的任务</span></span></button>'+
        '<button class="dm-btn" id="btnImpProjCsv"><span class="dm-ic">'+ICON.box+'</span><span class="dm-tx"><span class="dm-t">导入项目表格 CSV</span><span class="dm-d">更新项目表头字段</span></span></button>'+
        '<button class="dm-btn" id="btnImpStageCsv"><span class="dm-ic">'+ICON.flag+'</span><span class="dm-tx"><span class="dm-t">导入阶段表格 CSV</span><span class="dm-d">更新各阶段关键节点</span></span></button>'+
      '</div>'+
      '<div class="hint-line">合并规则：导入文件中出现的项目<b>整体以导入文件为准</b>（项目字段 + 8 阶段关键节点 + 全部任务 + 标签 + 意见）；未涉及的项目保持不动；导入后输出合并报告。</div>'+
      '</div></div>';
    /* ===== 阶段名库 ===== */
    html+='<div class="settings-group"><div class="sg-head">'+ICON.list+'全局阶段名库（可增不可减 · 每项目自动 8 实例）</div><div class="sg-body">';
    stages.forEach(function(s,i){
      html+='<div class="stagecfg-row" data-stage="'+esc(s.id)+'">'+
        '<span class="seq">'+(i+1)+'</span>'+
        '<input type="text" value="'+esc(s.name)+'" data-stagename="'+esc(s.id)+'">'+
        '<span class="row-ops"><button disabled title="阶段不可删除">'+ICON.trash+'</button></span>'+
      '</div>';
    });
    html+='<div style="display:flex;gap:8px;align-items:center;margin-top:10px;">'+
      '<input id="newStageName" placeholder="新阶段名称" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;flex:1;outline:none;">'+
      '<button class="btn sm primary" id="btnAddStage">'+ICON.plus+'新增阶段</button></div>'+
      '<div class="hint-line">规则：新增阶段名 → 所有项目自动同步补一个空阶段实例；改名 → 全项目联动；不可删除。</div>'+
      '</div></div>';
    /* ===== 标签库 ===== */
    html+='<div class="settings-group"><div class="sg-head">'+ICON.flag+'任务标签库（预设 + 自定义）</div><div class="sg-body">';
    tags.forEach(function(tg){
      html+='<div class="tagcfg-row">'+
        '<span class="tcolor" style="background:'+esc(tg.color)+'"></span>'+
        '<input type="text" value="'+esc(tg.name)+'" data-tagname="'+esc(tg.id)+'">'+
        '<span class="tagbuiltin">'+(tg.builtin?'预设':'自定义')+'</span>'+
        '<span class="row-ops"><button data-tagdel="'+esc(tg.id)+'" title="删除标签">'+ICON.trash+'</button></span>'+
      '</div>';
    });
    html+='<div style="display:flex;gap:8px;align-items:center;margin-top:10px;">'+
      '<input id="newTagName" placeholder="新标签名称" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;flex:1;outline:none;">'+
      '<button class="btn sm primary" id="btnAddTag">'+ICON.plus+'新增标签</button></div>'+
      '<div class="hint-line">任务编辑时可一键勾选预设标签，也可输入新标签名自动入库；删除标签会同步解除所有任务上的引用。</div>'+
      '</div></div>';
    /* ===== 数据维护 ===== */
    html+='<div class="settings-group"><div class="sg-head">'+ICON.gear+'数据维护</div><div class="sg-body">'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
        '<button class="btn" id="btnDemo">载入五大项目示例</button>'+
        '<button class="btn danger" id="btnClear">清空全部数据</button>'+
      '</div>'+
      '<div class="hint-line">载入示例会替换当前全部数据；清空将删除所有客户/项目/任务，均不可恢复，请先导出备份。</div>'+
      '</div></div>';
    main.innerHTML=html;

    $$('[data-stagename]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var r=C.renameStage(store, inp.getAttribute('data-stagename'), inp.value);
        if(!r.ok){ toast(r.reason,'err'); renderSettings($('#main')); return; }
        save(); renderAll(); toast('阶段已改名（全项目同步）','ok');
      });
    });
    $$('[data-tagname]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var r=C.renameTag(store, inp.getAttribute('data-tagname'), inp.value);
        if(!r.ok){ toast(r.reason,'err'); renderSettings($('#main')); return; }
        save(); renderAll(); toast('标签已改名','ok');
      });
    });
    $('#btnAddStage').onclick=function(){
      var name=$('#newStageName').value.trim();
      var r=C.addStage(store,name);
      if(!r.ok){ toast(r.reason,'err'); return; }
      save(); renderAll(); toast('阶段已新增（所有项目自动补实例）','ok');
    };
    $('#btnAddTag').onclick=function(){
      var name=$('#newTagName').value.trim();
      if(!name){ toast('请填写标签名称','err'); return; }
      C.ensureTagByName(store,name);
      save(); renderAll(); toast('标签已新增','ok');
    };
    $('#btnExpJson').onclick=exportJsonFile;
    $('#btnExpPick').onclick=openExportPicker;
    $('#btnExpProjCsv').onclick=exportProjectsCsvFile;
    $('#btnExpStageCsv').onclick=exportStagesCsvFile;
    $('#btnExpTaskCsv').onclick=exportTasksCsvFile;
    $('#btnImpJson').onclick=importJsonFile;
    $('#btnImpProjCsv').onclick=importProjectsCsvFile;
    $('#btnImpStageCsv').onclick=importStagesCsvFile;
    $('#btnImpTaskCsv').onclick=importTasksCsvFile;
    $('#btnDemo').onclick=function(){
      confirmBox('载入示例数据','将用五大项目示例数据<b>替换当前全部数据</b>，原数据丢失（请先导出备份）。确认继续？',function(){ resetDemo(); },true);
    };
    $('#btnClear').onclick=function(){
      confirmBox('清空数据','将删除<b>全部</b>客户/项目/任务数据，不可恢复。建议先导出备份。确认清空？',function(){
        store=C.freshStore(); save(); renderAll(); toast('已清空');
      },true);
    };
  }

  /* ================================================================
   * 导出导入
   * ================================================================ */
  function downloadFile(name, content, mime){
    var blob=new Blob([content],{type:mime||'application/octet-stream'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },200);
  }
  function exportJsonFile(){
    downloadFile('项目看板_完整备份_'+C.todayStr()+'.json', C.exportJson(store), 'application/json');
    toast('已导出 JSON 完整备份','ok');
  }
  function exportProjectsCsvFile(){
    downloadFile('项目清单_'+C.todayStr()+'.csv', '\ufeff'+C.exportProjectsCsv(store), 'text/csv;charset=utf-8');
    toast('已导出项目 CSV','ok');
  }
  function exportStagesCsvFile(){
    downloadFile('阶段关键节点_'+C.todayStr()+'.csv', '\ufeff'+C.exportStagesCsv(store), 'text/csv;charset=utf-8');
    toast('已导出阶段 CSV（关键节点）','ok');
  }
  function exportTasksCsvFile(){
    downloadFile('任务清单_'+C.todayStr()+'.csv', '\ufeff'+C.exportTasksCsv(store), 'text/csv;charset=utf-8');
    toast('已导出任务 CSV（含标签列）','ok');
  }
  function openExportPicker(){
    var projects=C.live(store.projects);
    if(!projects.length){ toast('暂无项目可导出','err'); return; }
    var members=C.live(store.members);
    openModal(
      '<div class="modal-head"><h3>按项目筛选导出 JSON</h3><button class="modal-x" data-close>'+ICON.x+'</button></div>'+
      '<div class="modal-body">'+
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;">'+
        '<select id="epMember" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;outline:none;">'+
          '<option value="">按成员快捷筛选…</option>'+
          members.map(function(m){return '<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>';}).join('')+
        '</select>'+
        '<button class="btn sm" id="epApply">勾选其参与项目</button>'+
        '<button class="btn sm" id="epAll">全选</button>'+
        '<button class="btn sm" id="epNone">清空</button>'+
      '</div>'+
      '<div class="ep-list">'+
        projects.map(function(p){
          var ps=C.projectStats(store,p.id,C.todayStr());
          return '<label class="ep-row"><input type="checkbox" value="'+esc(p.id)+'" checked>'+
            '<span class="ep-name">'+esc(p.name)+'</span>'+
            '<span class="ep-meta">'+esc(C.customerNameOf(store,p.customerId))+' · '+esc(C.stageName(store,C.currentStageIdOf(store,p)))+' · '+ps.done+'/'+ps.total+'</span></label>';
        }).join('')+
      '</div>'+
      '<div style="color:var(--text-2);font-size:12px;margin-top:8px;">导出的文件只含所选项目及其任务/标签，可直接分发给对应成员线下整理。</div>'+
      '</div>'+
      '<div class="modal-foot"><button class="btn" data-close>取消</button><button class="btn primary" id="epExport">'+ICON.download+'导出所选</button></div>','lg');
    $('#epAll').onclick=function(){ $$('.ep-list input').forEach(function(i){i.checked=true;}); };
    $('#epNone').onclick=function(){ $$('.ep-list input').forEach(function(i){i.checked=false;}); };
    $('#epApply').onclick=function(){
      var mid=$('#epMember').value; if(!mid){ toast('请先选择成员','err'); return; }
      var pidSet=new Set(C.projectsOfMember(store,mid).map(function(p){return p.id;}));
      $$('.ep-list input').forEach(function(c){ c.checked=pidSet.has(c.value); });
      toast('已勾选该成员参与的项目','ok');
    };
    $('#epExport').onclick=function(){
      var ids=$$('.ep-list input:checked').map(function(c){return c.value;});
      if(!ids.length){ toast('请至少勾选一个项目','err'); return; }
      downloadFile('看板_按项目导出_'+C.todayStr()+'.json', C.exportJson(store,ids), 'application/json');
      closeModal(); toast('已导出 '+ids.length+' 个项目','ok');
    };
  }
  function pickFile(accept, onText){
    var inp=document.createElement('input'); inp.type='file'; inp.accept=accept;
    inp.onchange=function(){
      var file=inp.files[0]; if(!file) return;
      var reader=new FileReader();
      reader.onload=function(){ onText(String(reader.result)); };
      reader.readAsText(file,'utf-8');
    };
    inp.click();
  }
  function importJsonFile(){
    pickFile('.json,application/json', function(text){
      var res=C.importJson(store, text);
      if(!res.ok){ toast(res.reason,'err'); return; }
      var s=res.stats;
      save(); renderAll();
      openModal(
        '<div class="modal-head"><h3>导入完成（按项目整体合并）</h3><button class="modal-x" data-close>'+ICON.x+'</button></div>'+
        '<div class="modal-body import-report">'+
          '<div class="ir-line"><span class="ir-num upd">'+s.updated+'</span>更新项目：'+(s.projectsUpdated.slice(0,4).join('、')||'—')+(s.projectsUpdated.length>4?' 等':'')+'</div>'+
          '<div class="ir-line"><span class="ir-num add">+'+s.added+'</span>新增项目：'+(s.projectsAdded.slice(0,4).join('、')||'—')+(s.projectsAdded.length>4?' 等':'')+'</div>'+
          '<div class="ir-line"><span class="ir-num keep">＝'+s.kept+'</span>未涉及保留（不覆盖）</div>'+
          '<div class="ir-line"><span class="ir-num orphan">⚠'+s.orphans+'</span>异常（引用断裂，请检查）</div>'+
        '</div>'+
        '<div class="modal-foot"><button class="btn primary" data-close>完成</button></div>','sm');
    });
  }
  function importProjectsCsvFile(){
    pickFile('.csv,text/csv', function(text){
      var rows=C.parseCsv(text.replace(/^\uFEFF/,''));
      if(rows.length<2){ toast('CSV 内容为空','err'); return; }
      var res=C.importProjectsCsv(store, rows);
      save(); renderAll();
      toast('项目导入完成：新增 '+res.added+'，更新 '+res.updated,'ok');
    });
  }
  function importStagesCsvFile(){
    pickFile('.csv,text/csv', function(text){
      var rows=C.parseCsv(text.replace(/^\uFEFF/,''));
      if(rows.length<2){ toast('CSV 内容为空','err'); return; }
      var res=C.importStagesCsv(store, rows);
      save(); renderAll();
      toast('阶段关键节点导入完成：更新 '+res.updated+' 处','ok');
    });
  }
  function importTasksCsvFile(){
    pickFile('.csv,text/csv', function(text){
      var rows=C.parseCsv(text.replace(/^\uFEFF/,''));
      if(rows.length<2){ toast('CSV 内容为空','err'); return; }
      var res=C.importTasksCsv(store, rows);
      save(); renderAll();
      toast('任务导入完成：'+(res.projects?'整体替换项目 '+res.projects+' 个、任务 '+res.tasks+' 条':'')+(res.skipped?'，跳过 '+res.skipped+'（项目不存在）':''),'ok');
    });
  }

  /* ================================================================
   * 事件委托与初始化
   * ================================================================ */
  function bindCardOpen(){
    $$('[data-open]').forEach(function(el){
      if(el._bound) return; el._bound=true;
      el.addEventListener('click', function(e){
        e.stopPropagation();
        var v=el.getAttribute('data-open');
        var parts=v.split(':');
        if(parts[0]==='project') openProjectDetail(parts[1]);
        else if(parts[0]==='goproject'){
          selectedProjectId=parts[1]; view='project';
          if($('#modalMask').classList.contains('show')) closeModal();
          renderTree(); renderMain();
        }
        else if(parts[0]==='task'||parts[0]==='edit-task') openTaskEditForm(parts[1]);
        else if(parts[0]==='edit') openProjectEditForm(parts[1]);
      });
    });
  }
  function toggleCurrentStage(stageId){
    var p=C.find(store.projects,selectedProjectId); if(!p) return;
    if(p.currentStageId===stageId){
      p.currentStageId=null; toast('已解除当前阶段锁定（恢复自动推导）','ok');
    } else {
      p.currentStageId=stageId; toast('已设为当前阶段（锁定）','ok');
    }
    p.updatedAt=C.now(); save(); renderAll();
  }
  function cycleStatus(taskId){
    var t=C.find(store.tasks,taskId); if(!t) return;
    var i=STATUS_CYCLE.indexOf(t.status);
    t.status=STATUS_CYCLE[(i+1)%STATUS_CYCLE.length];
    t.updatedAt=C.now(); save();
    if(lastMemberDetailId) openMemberDetail(lastMemberDetailId);
  }
  var lastMemberDetailId=null;
  function openMemberDetailWrap(memberId){
    lastMemberDetailId=memberId;
    openMemberDetail(memberId);
  }

  document.addEventListener('click', function(e){
    var el;
    if((el=e.target.closest('[data-km]'))){
      var kmPid=el.getAttribute('data-pid')||selectedProjectId;
      openKmForm(kmPid, el.getAttribute('data-km'));
      return;
    }
    if((el=e.target.closest('[data-setcur]'))){ toggleCurrentStage(el.getAttribute('data-setcur')); return; }
    if((el=e.target.closest('[data-proj-pick]'))){ selectedProjectId=el.getAttribute('data-proj-pick'); renderAll(); return; }
    if((el=e.target.closest('[data-tb-toggle]'))){ taskBoardAll=el.getAttribute('data-tb-toggle')==='1'; renderAll(); return; }
    if((el=e.target.closest('[data-addtask]'))){
      var pidForTask=selectedProjectId;
      openTaskForm(pidForTask, el.getAttribute('data-addtask'));
      return;
    }
    if((el=e.target.closest('[data-cycle]'))){ cycleStatus(el.getAttribute('data-cycle')); return; }
    if((el=e.target.closest('[data-tagdel]'))){
      var tid=el.getAttribute('data-tagdel');
      var tg=C.find(store.tags,tid);
      confirmBox('删除标签','删除「<b>'+esc(tg?tg.name:'')+'</b>」后，所有任务上的该标签将自动解除引用。确认删除？',function(){
        C.removeTag(store,tid); save(); renderSettings($('#main')); toast('标签已删除','ok');
      },true);
      return;
    }
  });

  function render(){ renderTabs(); renderTree(); renderMain(); }

  /* ---------- 初始化 ---------- */
  function init(){
    load();
    $('#btnExport').onclick=function(){
      var r=this.getBoundingClientRect();
      menuCtx={
        json:exportJsonFile, pick:openExportPicker,
        pcsv:exportProjectsCsvFile, scsv:exportStagesCsvFile, tcsv:exportTasksCsvFile
      };
      openMenu(r.left, r.bottom+4, [
        {act:'json', label:'导出 JSON 完整备份', icon:ICON.download},
        {act:'pick', label:'按项目筛选导出 JSON', icon:ICON.download},
        {act:'pcsv', label:'导出项目 CSV', icon:ICON.download},
        {act:'scsv', label:'导出阶段 CSV（关键节点）', icon:ICON.download},
        {act:'tcsv', label:'导出任务 CSV', icon:ICON.download}
      ]);
    };
    $('#btnImport').onclick=function(){
      var r=this.getBoundingClientRect();
      menuCtx={
        json:importJsonFile, pcsv:importProjectsCsvFile, scsv:importStagesCsvFile, tcsv:importTasksCsvFile
      };
      openMenu(r.left, r.bottom+4, [
        {act:'json', label:'导入 JSON（按项目合并）', icon:ICON.upload},
        {act:'pcsv', label:'导入项目 CSV', icon:ICON.upload},
        {act:'scsv', label:'导入阶段 CSV', icon:ICON.upload},
        {act:'tcsv', label:'导入任务 CSV', icon:ICON.upload}
      ]);
    };
    $('#btnAddCustomer').onclick=function(){ openProjectForm(scope.customerId); };
    $('#searchInput').addEventListener('input', function(){ searchKw=this.value.trim(); renderMain(); });
    $('#main').addEventListener('click', function(e){
      var opener=e.target.closest('[data-open]');
      if(!opener) return;
      var v=opener.getAttribute('data-open');
      var parts=v.split(':');
      if(parts[0]==='project') openProjectDetail(parts[1]);
      else if(parts[0]==='goproject'){ selectedProjectId=parts[1]; view='project'; render(); }
      else if(parts[0]==='task'||parts[0]==='edit-task') openTaskEditForm(parts[1]);
      else if(parts[0]==='edit') openProjectEditForm(parts[1]);
    });
    render();
  }
  /* 注入成员详情包装 */
  var _openMemberDetailRaw=openMemberDetail;
  openMemberDetail=function(mid){ lastMemberDetailId=mid; _openMemberDetailRaw(mid); };

  document.addEventListener('DOMContentLoaded', init);
  if(document.readyState!=='loading') init();
})();
</script>
</body>
</html>
